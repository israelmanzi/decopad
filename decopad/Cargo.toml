[package]
name = "decopad"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
evdev = "0.13.2"
fontdue = "0.9.4"
inotify = "0.11.5"
nix = { version = "0.31.3", features = ["poll", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
tiny-skia = "0.12.0"
toml = "1.1.8"
x11rb = { version = "0.14.0", features = ["xinput", "randr", "shape"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
